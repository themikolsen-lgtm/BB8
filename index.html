<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Programme BB8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --shell:rgba(255,255,255,.4);
    --ink:#1B1C22;
    --ink-on-light:#14151A;
    --muted:#6E7080;
    --line:rgba(20,21,26,.09);
    --grey-card:rgba(20,21,26,.05);
    --pill-dark:#8A8D99;
    --pill-dark-2:#5C5F6C;
    --glass-bg: rgba(20,21,26,.05);
    --glass-bg-strong: rgba(20,21,26,.09);
    --glass-border: rgba(20,21,26,.12);
    --glass-highlight: rgba(255,255,255,.6);
    --glass-light-bg: rgba(20,21,26,.06);
    --glass-light-border: rgba(20,21,26,.12);
    /* ---------- accent iOS 26 (Liquid Glass) ---------- */
    --accent:#5E5CE6;
    --accent-soft:rgba(94,92,230,.14);
    --accent-soft-2:rgba(94,92,230,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:#FFFFFF;
    min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI","Montserrat",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:0;
  }

  .phone-shell{
    width:100%;
    max-width:none;
    background:var(--shell);
    backdrop-filter:blur(2px);
    border-radius:0;
    border:none;
    box-shadow:none;
    overflow:hidden;
    position:relative;
    height:100vh;
    max-height:none;
    display:flex;
    flex-direction:column;
  }

  .bg-blobs{
    position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
  }
  .bg-blobs span{
    position:absolute; border-radius:50%; filter:blur(70px); opacity:.55;
  }
  .bg-blobs span:nth-child(1){ width:280px; height:280px; top:-80px; left:-60px; background:#FFB4A2; }
  .bg-blobs span:nth-child(2){ width:240px; height:240px; top:120px; right:-70px; background:#A2D2FF; }
  .bg-blobs span:nth-child(3){ width:260px; height:260px; bottom:60px; left:-50px; background:#CDB4FF; }
  .bg-blobs span:nth-child(4){ width:220px; height:220px; bottom:-60px; right:-40px; background:#B7F0AE; }
  .bg-blobs span:nth-child(5){ width:200px; height:200px; top:40%; left:38%; background:#FFF3A0; }

  .screens{
    position:relative; z-index:1;
    flex:1;
    overflow-y:auto;
    padding:22px 20px 160px;
  }
  .screens::-webkit-scrollbar{display:none;}

  /* ---------- shared bits ---------- */
  h1.page-title{
    font-size:26px; font-weight:900; margin:0 0 14px; letter-spacing:-0.02em;
    font-family:"Arial Black", Impact, "Helvetica Neue", Arial, sans-serif;
    font-style:italic;
    text-transform:uppercase;
  }
  .section-label{ font-size:13px; color:var(--muted); font-weight:600; margin:10px 2px 6px;}

  /* ---------- date strip : texte simple, seul le jour sélectionné a une pilule (style iOS 26) ---------- */
  .date-strip{ display:flex; align-items:center; justify-content:space-between; gap:2px; margin-bottom:10px; overflow-x:auto; }
  .date-strip::-webkit-scrollbar{ display:none; }
  .date-chip{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    background:transparent;
    border:1px solid transparent;
    box-shadow:none;
    border-radius:999px;
    padding:8px 12px;
    text-align:center;
    cursor:pointer;
    white-space:nowrap;
    font-size:14.5px; font-weight:600; color:var(--ink);
    transition:transform .15s ease, background .25s ease, color .2s ease, box-shadow .25s ease;
  }
  .date-chip:active{ transform:scale(.92); }
  .date-chip.active{
    background:rgba(255,255,255,.5);
    backdrop-filter:blur(20px) saturate(200%); -webkit-backdrop-filter:blur(20px) saturate(200%);
    border:1px solid rgba(255,255,255,.6);
    color:var(--ink);
    font-weight:900;
    font-style:italic;
    font-size:19px;
    padding:9px 16px;
    animation:chipPop .3s ease;
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      0 4px 10px -6px rgba(20,21,26,.2);
  }
  @keyframes chipPop{ 0%{ transform:scale(.9); } 60%{ transform:scale(1.05); } 100%{ transform:scale(1); } }

  /* ---------- featured / day pastel cards ---------- */
  .feat-card{
    position:relative;
    border-radius:0;
    padding:6px 0;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    margin-bottom:0;
    cursor:pointer;
    background:transparent;
    transition:transform .15s ease, opacity .2s ease;
  }
  .feat-card:active{ transform:scale(.97); opacity:.7; }
  .feat-card .photo{
    position:absolute; right:0; top:0; bottom:0; width:46%;
    background-size:cover; background-position:center 20%;
    -webkit-mask-image:linear-gradient(to right, transparent 0%, #000 42%);
    mask-image:linear-gradient(to right, transparent 0%, #000 42%);
  }
  .feat-card .kicker{
    font-size:24px; font-weight:900; color:var(--ink); letter-spacing:-.01em; position:relative; z-index:2;
    font-family:"Arial Black", Impact, "Helvetica Neue", Arial, sans-serif;
    font-style:italic;
    text-transform:uppercase;
  }
  .feat-card .ftitle{
    font-size:13px; font-weight:600; color:var(--muted); margin:2px 0 0;
    width:100%; text-align:center; line-height:1.2; position:relative; z-index:2;
  }

  .ex-list{ display:flex; flex-direction:column; gap:10px; margin-top:8px;}
  .ex-row{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(200%); -webkit-backdrop-filter:blur(20px) saturate(200%);
    border:1px solid var(--glass-border);
    border-radius:20px; padding:10px 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 8px 18px -16px rgba(20,21,26,.35);
    transition:transform .15s ease, opacity .2s ease;
  }
  .ex-row:active{ transform:scale(.98); opacity:.85; }
  .ex-row .ex-info{ display:flex; flex-direction:column; gap:4px; min-width:0;}
  .ex-row .ex-name{ font-size:14px; font-weight:800; color:var(--ink); text-transform:uppercase; line-height:1.25;}
  .ex-row .ex-sets{ font-size:12.5px; font-weight:700; color:var(--muted);}
  .ex-row .ex-photo{
    width:52px; height:52px; border-radius:14px; overflow:hidden; flex:0 0 auto;
    background-size:cover; background-position:center;
    border:1px solid var(--line);
  }

  .video-card{
    border-radius:20px; overflow:hidden;
    border:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter:blur(28px) saturate(200%); -webkit-backdrop-filter:blur(28px) saturate(200%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 8px 20px -16px rgba(0,0,0,.5);
    margin:14px 0 6px;
  }
  .video-frame-wrap{ position:relative; width:100%; aspect-ratio:16/9; background:#000; cursor:pointer;}
  .video-frame-wrap img{ width:100%; height:100%; object-fit:cover; display:block; opacity:.8;}
  .video-frame-wrap iframe{ position:absolute; inset:0; width:100%; height:100%; border:none;}
  .play-btn{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:54px; height:54px; border-radius:50%;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(14px) saturate(180%); -webkit-backdrop-filter:blur(14px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px -4px rgba(0,0,0,.35);
    transition:transform .15s ease;
  }
  .video-frame-wrap:active .play-btn{ transform:translate(-50%,-50%) scale(.88); }
  .play-btn::before{ content:""; border-style:solid; border-width:9px 0 9px 15px; border-color:transparent transparent transparent var(--ink-on-light); margin-left:4px;}
  .video-meta{ padding:12px 14px 14px; display:flex; align-items:center; justify-content:space-between;}
  .video-meta .vt{ font-weight:800; font-size:14px;}
  .video-meta .vtag{
    font-size:10.5px; font-weight:800; letter-spacing:.04em; color:#fff;
    background:rgba(20,21,26,.75);
    backdrop-filter:blur(14px) saturate(160%); -webkit-backdrop-filter:blur(14px) saturate(160%);
    border:1px solid rgba(255,255,255,.15);
    padding:4px 9px; border-radius:999px; text-transform:uppercase;
  }

  .rest-note{
    margin-top:16px;
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(200%); -webkit-backdrop-filter:blur(20px) saturate(200%);
    border:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
    border-radius:22px; padding:16px; font-size:13px; color:var(--ink); font-weight:600; line-height:1.5; opacity:.85;
  }

  /* ---------- inline detail section ---------- */
  .inline-detail{ margin-top:0; padding-top:4px; border-top:1px solid var(--line); }

  /* ---------- lightbox (agrandissement photo / vidéo) ---------- */
  .lightbox-overlay{
    position:absolute; inset:0; z-index:60;
    background:rgba(8,8,10,.82);
    backdrop-filter:blur(16px) saturate(140%); -webkit-backdrop-filter:blur(16px) saturate(140%);
    display:flex; align-items:center; justify-content:center;
    padding:28px;
    opacity:0; pointer-events:none;
    transition:opacity .25s ease;
  }
  .lightbox-overlay.show{ opacity:1; pointer-events:auto; }
  .lightbox-content{
    position:relative;
    max-width:100%; max-height:100%;
    border-radius:26px; overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
    transform:scale(.92);
    transition:transform .25s ease;
  }
  .lightbox-overlay.show .lightbox-content{ transform:scale(1); }
  .lightbox-content img{
    display:block; width:100%; height:auto; max-height:78vh; object-fit:contain; border-radius:26px;
  }
  .lightbox-content iframe{
    display:block; width:88vw; max-width:640px; aspect-ratio:16/9; height:auto; border:none; border-radius:26px;
  }
  .lightbox-close{
    position:absolute; top:10px; right:10px; z-index:5;
    width:34px; height:34px; border-radius:50%;
    background:rgba(255,255,255,.7);
    backdrop-filter:blur(14px) saturate(180%); -webkit-backdrop-filter:blur(14px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:16px; color:#1B1C22; cursor:pointer;
    box-shadow:0 6px 14px rgba(0,0,0,.3);
  }
  .lightbox-close:active{ transform:scale(.88); }

  .ex-row .ex-photo{ cursor:pointer; }
  .video-frame-wrap{ cursor:pointer; }

  /* ---------- bouton Progression, petit, en haut à droite du titre ---------- */
  .page-header{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    margin-bottom:14px;
  }
  .page-header h1.page-title{ margin:0; }
  .progression-btn-sm{
    display:flex; align-items:center; gap:5px; flex:0 0 auto;
    padding:7px 12px;
    border-radius:999px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(20px) saturate(200%); -webkit-backdrop-filter:blur(20px) saturate(200%);
    border:1px solid rgba(20,21,26,.1);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.8),
      0 4px 10px -6px rgba(20,21,26,.25);
    cursor:pointer;
    font-size:12px; font-weight:800; color:var(--ink);
    letter-spacing:-0.01em;
    white-space:nowrap;
    transition:transform .15s ease, opacity .2s ease;
  }
  .progression-btn-sm:active{ transform:scale(.94); opacity:.8; }

  .progression-content{
    position:relative;
    width:88vw; max-width:420px;
    max-height:78vh; overflow-y:auto;
    background:rgba(255,255,255,.85);
    backdrop-filter:blur(30px) saturate(200%); -webkit-backdrop-filter:blur(30px) saturate(200%);
    border:1px solid rgba(255,255,255,.6);
    border-radius:26px;
    padding:22px 20px 20px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  .progression-content h2{
    font-size:19px; font-weight:800; margin:0 0 14px;
    letter-spacing:-0.02em;
  }
  .progression-content .prog-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
    font-size:14px; font-weight:700; color:var(--ink);
  }
  .progression-content .prog-row:last-of-type{ border-bottom:none; }
  .progression-content .prog-row .prog-label{ color:var(--accent); font-weight:800; min-width:32px; }
  .progression-content .prog-note{
    margin-top:14px; font-size:13px; font-weight:600; color:var(--muted); line-height:1.5;
  }


  .video-play-btn{
    width:52px; height:52px; border-radius:12px; flex:0 0 auto;
    background:rgba(20,21,26,.88); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:15px; padding:0; cursor:pointer;
    box-shadow:0 6px 14px -6px rgba(0,0,0,.4);
    transition:transform .15s ease, background .2s ease;
  }
  .video-play-btn span{ display:flex; align-items:center; justify-content:center; width:100%; height:100%; transform:translateX(1px); }
  .video-play-btn:active{ transform:scale(.88); }
  .video-play-btn.is-open{ background:#D9463F; padding-left:0; }
  .video-expand{
    max-height:0; overflow:hidden;
    transition:max-height .35s ease;
  }
  .video-expand.open{ max-height:280px; }
  .video-expand-inner{ padding-top:10px; }
  .video-expand iframe{
    display:block; width:100%; aspect-ratio:16/9; height:auto;
    border:none; border-radius:16px;
  }

  /* ---------- timer dock (floating bar at bottom) : simple positionneur, sans double cadre ---------- */
  .timer-dock{
    position:absolute; left:10px; right:10px; bottom:calc(16px + env(safe-area-inset-bottom)); z-index:20;
  }
  .timer-bar{ position:relative; z-index:2; display:flex; align-items:center; justify-content:center; gap:6px;}
  .ring-wrap{ position:relative; width:40px; height:40px; flex:0 0 auto;}
  .ring-wrap svg{ transform:rotate(-90deg);}
  .ring-bg{ fill:none; stroke:rgba(20,21,26,.18); stroke-width:4;}
  .ring-fg{ fill:none; stroke:#1B1C22; stroke-width:4; stroke-linecap:round; stroke-dasharray:107; stroke-dashoffset:107; transition:stroke .2s ease;}
  .ring-wrap .center-dot{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;}
  .center-dot .pulse{ width:7px;height:7px;border-radius:50%; background:#1B1C22;}
  .center-dot .pulse.running{ animation:pulse 1s ease-in-out infinite; background:#E14B4B;}
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(225,75,75,.45);} 50%{box-shadow:0 0 0 6px rgba(225,75,75,0);} }
  .timer-mid{ flex:1; line-height:1.1;}
  .timer-mid .t-label{ font-size:10px; font-weight:800; letter-spacing:.06em; color:rgba(20,21,26,.65); text-transform:uppercase;}
  .timer-mid .t-time{ font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:1px; color:#1B1C22;}

  /* ---------- barre segmentée façon iOS 26 (Play / 60s / 30s / 15s) ---------- */
  .timer-actions{
    display:flex; align-items:center; gap:2px;
    width:100%; height:64px;
    background:rgba(255,255,255,.14);
    backdrop-filter:blur(40px) saturate(220%); -webkit-backdrop-filter:blur(40px) saturate(220%);
    border:1px solid rgba(255,255,255,.55);
    border-radius:999px;
    padding:4px;
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.85),
      inset 0 -1px 0 rgba(255,255,255,.15),
      0 20px 40px -18px rgba(20,21,26,.18),
      0 4px 14px rgba(20,21,26,.08);
  }
  .t-btn{
    position:relative;
    flex:1 1 0; min-width:0; height:100%;
    border-radius:999px;
    background:transparent;
    border:none;
    box-shadow:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; white-space:nowrap;
    font-size:16px; font-weight:700; color:#1B1C22;
    letter-spacing:-0.01em;
    transition:background .2s ease, color .2s ease, box-shadow .2s ease, transform .15s ease;
    overflow:hidden;
  }
  .t-btn:active{ transform:scale(.94); }

  /* segment mis en avant (relief blanc, façon "New" dans la tab bar iOS 26) */
  .t-btn.toggle.is-running,
  .t-btn.quick.is-running{
    background:linear-gradient(180deg, rgba(255,255,255,.95), rgba(255,255,255,.8));
    box-shadow:
      0 3px 8px rgba(0,0,0,.14),
      0 1px 0 rgba(255,255,255,.6),
      inset 0 1px 0 rgba(255,255,255,.9);
    color:var(--accent);
  }

  .t-btn.toggle{ font-size:22px; color:#1B1C22; }
  .t-btn.quick{
    font-size:19px; font-weight:900;
    font-family:"Arial Black", Impact, "Helvetica Neue", Arial, sans-serif;
    font-style:italic;
    text-transform:uppercase;
    letter-spacing:-0.02em;
    transform:skewX(-6deg);
  }
  .t-btn.quick span{ display:inline-block; transform:skewX(6deg); }
  .t-btn.quick:active{ transform:skewX(-6deg) scale(.94); }

  /* ---------- countdown overlay (center screen, last seconds) ---------- */
  .countdown-overlay{
    position:absolute; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    background:rgba(8,8,10,.62);
    backdrop-filter:blur(18px) saturate(160%);
    -webkit-backdrop-filter:blur(18px) saturate(160%);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease;
  }
  .countdown-overlay.show{ opacity:1; }
  .countdown-viewport{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    height:180px;
  }
  .digit-slot{
    position:relative;
    width:100px; height:180px;
    overflow:hidden;
    transition:width .25s ease, opacity .25s ease, margin .25s ease;
  }
  .digit-slot.hidden{ width:0; opacity:0; margin:0; }
  .countdown-num{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-size:140px; font-weight:900; color:#fff;
    font-variant-numeric:tabular-nums;
    text-shadow:0 8px 30px rgba(0,0,0,.4);
    transition:transform .32s cubic-bezier(.32,.9,.35,1), opacity .32s ease;
  }
  .countdown-num.cd-enter{ transform:translateY(115%); opacity:0; }
  .countdown-num.cd-leave{ transform:none; opacity:0; transition:opacity .16s ease; }

</style>
</head>
<body>

<div class="phone-shell">
  <div class="bg-blobs"><span></span><span></span><span></span><span></span><span></span></div>
  <div class="screens">

    <!-- HOME -->
    <div class="page-header">
      <h1 class="page-title">Programme BB8</h1>
      <button class="progression-btn-sm" onclick="openProgression()">📈 Progression</button>
    </div>
    <div class="date-strip" id="dateStrip"></div>

    <div id="featuredCard"></div>

    <!-- INLINE DETAIL (shows the selected day right below) -->
    <div class="inline-detail" id="inlineDetail"></div>

  </div>

  <!-- CHRONO -->
  <div class="timer-dock">
    <div class="timer-bar">
      <div class="timer-actions">
        <button class="t-btn toggle" id="toggleBtn" onclick="toggleTimer()">▶</button>
        <button class="t-btn quick quick-60" id="quickBtn60" onclick="startQuickTimer(60)"><span>60s</span></button>
        <button class="t-btn quick quick-30" id="quickBtn30" onclick="startQuickTimer(30)"><span>30s</span></button>
        <button class="t-btn quick quick-15" id="quickBtn15" onclick="startQuickTimer(15)"><span>15s</span></button>
      </div>
    </div>
  </div>


  <!-- COUNTDOWN OVERLAY (10, 9, 8... plein écran) -->
  <div class="countdown-overlay" id="countdownOverlay">
    <div class="countdown-viewport" id="countdownViewport">
      <div class="digit-slot hidden" id="digitTens"></div>
      <div class="digit-slot" id="digitUnits"></div>
    </div>
  </div>

  <!-- LIGHTBOX (agrandissement photo exercice / vidéo) -->
  <div class="lightbox-overlay" id="lightboxOverlay" onclick="if(event.target===this) closeLightbox()">
    <div class="lightbox-content" id="lightboxContent"></div>
  </div>
</div>

<script>
  // ---------- Photos (Unsplash, libres de droits) ----------
  const IMG_PRESS   = "https://images.unsplash.com/photo-1653773869760-5b0f846231fb?w=800&q=70&auto=format&fit=crop";
  const IMG_MILPRESS= "https://images.unsplash.com/photo-1692372372344-41aed374b848?w=800&q=70&auto=format&fit=crop";
  const IMG_BACK    = "https://images.unsplash.com/photo-1758223521209-f70658aa6bb6?w=800&q=70&auto=format&fit=crop";
  const IMG_SHOULD  = "https://images.unsplash.com/photo-1641337221253-fdc7237f6b61?w=800&q=70&auto=format&fit=crop";

  // ---------- Photos par jour (Unsplash) ----------
  const IMG_LUN = "https://images.unsplash.com/photo-1605296867304-46d5465a13f1?w=800&q=70&auto=format&fit=crop";

  function getFocus(d){
    if(!d.exercises || !d.exercises.length) return d.focus; // jour vidéo (CrossFit, etc.) -> libellé fixe

    d.exercises.forEach(ex=>{
      const g = MUSCLE_BY_EXO[ex.name];
      if(g && !groups.includes(g)) groups.push(g);
    });
    return groups.length ? groups.join(' + ') : d.focus;
  }

    { key:'dim', abbr:'Dim', num:7, name:'Dimanche', focus:'Repos complet', color:'#E7E8ED', tag:'#D3D5DC', photo:IMG_DIM,
      exercises:[]},
  ];


  const JS_DAY_TO_KEY = ['dim','lun','mar','mer','jeu','ven','sam'];
  const todayKey = JS_DAY_TO_KEY[new Date().getDay()];
  let selectedKey = todayKey;

  // ---------- attribution des vraies dates du jour à chaque jour de la semaine ----------
  function getMonday(d){
    d = new Date(d);
    const day = d.getDay();
    const diff = (day === 0 ? -6 : 1) - day;
    d.setDate(d.getDate() + diff);
    return d;
  }
  const monday = getMonday(new Date());
  DAYS.forEach((d, i)=>{
    const dt = new Date(monday);
    dt.setDate(monday.getDate() + i);
    d.date = dt;
  });

  // ---------- date strip ----------
  const dateStrip = document.getElementById('dateStrip');
  function renderDateStrip(){
    dateStrip.innerHTML = '';
    DAYS.forEach(d=>{
      const chip = document.createElement('button');
      chip.className = 'date-chip' + (d.key===selectedKey ? ' active' : '');
      chip.innerHTML = `${d.abbr}`;
      chip.onclick = ()=>{ selectedKey = d.key; renderDateStrip(); renderFeatured(); showDetail(d.key); };
      dateStrip.appendChild(chip);
    });
  }

  // ---------- featured card (home) ----------
  const featuredCard = document.getElementById('featuredCard');
  function renderFeatured(){
    const d = DAYS.find(x=>x.key===selectedKey);
    const idx = DAYS.findIndex(x=>x.key===selectedKey);
    const pct = Math.round(((idx+1)/7)*100);
    featuredCard.innerHTML = `
      <div class="feat-card" onclick="showDetail('${d.key}')">
        <div>
          <div class="ftitle">${getFocus(d)}</div>
        </div>
      </div>`;
  }

  // ---------- inline detail ----------
  function showDetail(key){
    const d = DAYS.find(x=>x.key===key);
    let html = '';
    const hasList = d.exercises.length || d.video || d.abdoVideo;
    if(hasList){
      html += `<div class="section-label" style="margin-top:0;">Exercices</div><div class="ex-list">`;
      d.exercises.forEach(ex=>{
        const flip = ex.name.includes('Droite');
        html += `<div class="ex-row">
          <div class="ex-info">
            <div class="ex-name">${ex.name}</div>
            <div class="ex-sets">${ex.sets}</div>
          </div>
          <div class="ex-photo" style="background-image:url('${ex.img}');${flip ? 'transform:scaleX(-1);' : ''}" data-img="${ex.img}" data-flip="${flip}" onclick="openImageLightbox(this)"></div>
        </div>`;
      });
      if(d.video){
        html += `<div class="ex-row">
          <div class="ex-info">
            <div class="ex-name">${d.video.title}</div>
            <div class="ex-sets">Vidéo guidée</div>
          </div>
          <button class="video-play-btn" id="videoBtn-${d.key}" onclick="toggleVideoRow('${d.key}','${d.video.id}')" aria-label="Lire la vidéo"><span>▶</span></button>
        </div>
        <div class="video-expand" id="videoExpand-${d.key}"><div class="video-expand-inner" id="videoExpandInner-${d.key}"></div></div>`;
      }
      if(d.abdoVideo){
        html += `<div class="ex-row">
          <div class="ex-info">
            <div class="ex-name">${d.abdoVideo.title}</div>
            <div class="ex-sets">Vidéo guidée</div>
          </div>
          <button class="video-play-btn" id="videoBtn-${d.key}-abdo" onclick="toggleVideoRow('${d.key}-abdo','${d.abdoVideo.id}')" aria-label="Lire la vidéo"><span>▶</span></button>
        </div>
        <div class="video-expand" id="videoExpand-${d.key}-abdo"><div class="video-expand-inner" id="videoExpandInner-${d.key}-abdo"></div></div>`;
      }
      html += `</div>`;
    } else {
      html += `<div class="rest-note">Pas d'exercices musculation aujourd'hui — lance la vidéo ci-dessous et laisse tourner le chrono séance pendant ta séance.</div>`;
    }
    document.getElementById('inlineDetail').innerHTML = html;
    document.getElementById('inlineDetail').scrollIntoView({behavior:'smooth', block:'start'});
  }

  function openImageLightbox(el){
    const url = el.getAttribute('data-img');
    const flip = el.getAttribute('data-flip') === 'true';
    const content = document.getElementById('lightboxContent');
    content.innerHTML = `<div class="lightbox-close" onclick="closeLightbox(event)">✕</div><img src="${url}" style="${flip ? 'transform:scaleX(-1);' : ''}">`;
    document.getElementById('lightboxOverlay').classList.add('show');
  }

  function toggleVideoRow(key, id){
    const expand = document.getElementById('videoExpand-'+key);
    const inner = document.getElementById('videoExpandInner-'+key);
    const btn = document.getElementById('videoBtn-'+key);
    const isOpen = expand.classList.contains('open');

    // ferme les autres lecteurs vidéo ouverts
    document.querySelectorAll('.video-expand.open').forEach(el=>{
      if(el !== expand){
        el.classList.remove('open');
        el.querySelector('.video-expand-inner').innerHTML = '';
      }
    });
    document.querySelectorAll('.video-play-btn.is-open').forEach(b=>{
      if(b !== btn){ b.classList.remove('is-open'); b.querySelector('span').textContent = '▶'; }
    });

    if(isOpen){
      expand.classList.remove('open');
      btn.classList.remove('is-open');
      btn.querySelector('span').textContent = '▶';
      setTimeout(()=>{ inner.innerHTML = ''; }, 350);
    } else {
      inner.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" title="video" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      expand.classList.add('open');
      btn.classList.add('is-open');
      btn.querySelector('span').textContent = '❚❚';
      setTimeout(()=>{ expand.scrollIntoView({behavior:'smooth', block:'nearest'}); }, 200);
    }
  }

  function closeLightbox(e){
    if(e) e.stopPropagation();
    document.getElementById('lightboxOverlay').classList.remove('show');
    setTimeout(()=>{ document.getElementById('lightboxContent').innerHTML=''; }, 250);
  }

  function openProgression(){
    const rows = [
      ['S1', '15 / 14 / 13 / 12'],
      ['S2', '15 / 15 / 14 / 13'],
      ['S3', '15 / 15 / 15 / 14'],
      ['S4', '15 / 15 / 15 / 15 ✅'],
    ];
    const rowsHtml = rows.map(r => `<div class="prog-row"><span class="prog-label">${r[0]}</span><span>${r[1]}</span></div>`).join('');
    const content = document.getElementById('lightboxContent');
    content.innerHTML = `<div class="lightbox-close" onclick="closeLightbox(event)">✕</div>
      <div class="progression-content">
        <h2>📈 Progression</h2>
        ${rowsHtml}
        <div class="prog-note">S5 : +2,5 kg, puis tu recommences à progresser à partir de ~12–15 reps.</div>
      </div>`;
    document.getElementById('lightboxOverlay').classList.add('show');
  }

  renderDateStrip();
  renderFeatured();
  showDetail(selectedKey);

  // ---------- Chrono séance ----------
  let seconds = 0, running = false, intervalId = null;
  const toggleBtn = document.getElementById('toggleBtn');

  function fmt(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = (s%60).toString().padStart(2,'0');
    return `${m}:${sec}`;
  }
  function render(){
    toggleBtn.textContent = running ? fmt(seconds) : '▶';
  }
  function toggleTimer(){
    running = !running;
    toggleBtn.classList.toggle('is-running', running);
    render();
    if(running){ intervalId = setInterval(()=>{ seconds++; render(); }, 1000); }
    else { clearInterval(intervalId); beep(); }
  }
  render();

  // ---------- Minuteur rapide 25s/20s/15s avec sonnerie (indépendant du chrono séance) ----------
  let quickRunning = false, quickInterval = null, quickActiveBtn = null, quickDuration = null;
  const quickButtons = {
    60: document.getElementById('quickBtn60'),
    30: document.getElementById('quickBtn30'),
    15: document.getElementById('quickBtn15'),
  };

  function quickLabel(sec){
    return `<span>${sec}s</span>`;
  }

  // AudioContext unique, débloqué lors d'un geste utilisateur (tap), réutilisé ensuite.
  // Nécessaire pour que le bip final (déclenché depuis un setInterval, donc SANS
  // geste utilisateur direct) fonctionne bien sur iPhone/Safari.
  let sharedAudioCtx = null;
  function unlockAudio(){
    if(!sharedAudioCtx){
      try{ sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
    }
    if(sharedAudioCtx.state === 'suspended'){
      sharedAudioCtx.resume();
    }
    // "réveille" le hardware audio iOS avec un son quasi silencieux joué immédiatement dans le geste
    try{
      const buffer = sharedAudioCtx.createBuffer(1, 1, 22050);
      const src = sharedAudioCtx.createBufferSource();
      src.buffer = buffer;
      src.connect(sharedAudioCtx.destination);
      src.start(0);
    }catch(e){}
  }
  document.addEventListener('touchstart', unlockAudio, {once:true, passive:true});
  document.addEventListener('click', unlockAudio, {once:true});

  function beep(){
    try{
      const ctx = sharedAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if(ctx.state === 'suspended'){ ctx.resume(); }
      const now = ctx.currentTime;
      // petit arpège ascendant façon notification moderne
      const notes = [740, 932.33, 1174.66, 1567.98]; // F#5, A#5, D6, G6
      notes.forEach((freq, i)=>{
        const t = now + i*0.11;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filt = ctx.createBiquadFilter();
        filt.type = 'lowpass';
        filt.frequency.value = 4000;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, t);
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
        osc.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
        osc.start(t); osc.stop(t + 0.5);
      });
    }catch(e){}
  }

  const countdownOverlay = document.getElementById('countdownOverlay');
  const digitSlots = {
    tens:  { el: document.getElementById('digitTens'),  current: null, currentEl: null },
    units: { el: document.getElementById('digitUnits'), current: null, currentEl: null }
  };

  function setDigit(slot, char){
    if(char === null){
      // pas de dizaine à afficher (nombre à 1 chiffre) : on masque proprement le slot
      if(slot.current !== null){
        slot.el.classList.add('hidden');
        if(slot.currentEl){ slot.currentEl.remove(); slot.currentEl = null; }
        slot.current = null;
      }
      return;
    }
    slot.el.classList.remove('hidden');
    if(slot.current === char) return; // chiffre inchangé : il reste immobile, aucune animation

    // seul CE chiffre bouge : l'ancien disparaît sur place, le nouveau glisse depuis le bas
    const leaving = slot.currentEl;
    if(leaving){
      leaving.classList.add('cd-leave');
      setTimeout(()=>{ leaving.remove(); }, 180);
    }
    const incoming = document.createElement('div');
    incoming.className = 'countdown-num cd-enter';
    incoming.textContent = char;
    slot.el.appendChild(incoming);
    void incoming.offsetWidth; // reflow pour activer la transition
    incoming.classList.remove('cd-enter');
    slot.current = char;
    slot.currentEl = incoming;
  }

  function showCountdown(n){
    countdownOverlay.classList.add('show');
    const str = String(n);
    if(str.length > 1){
      setDigit(digitSlots.tens, str[0]);
      setDigit(digitSlots.units, str[1]);
    } else {
      setDigit(digitSlots.tens, null);
      setDigit(digitSlots.units, str[0]);
    }
  }
  function hideCountdown(){
    countdownOverlay.classList.remove('show');
  }

  function startQuickTimer(duration){
    unlockAudio();
    const btn = quickButtons[duration];

    if(quickRunning){
      if(quickActiveBtn === btn){
        // deuxième clic sur le même bouton pendant le décompte = annuler
        clearInterval(quickInterval);
        quickRunning = false;
        btn.classList.remove('is-running');
        btn.innerHTML = quickLabel(duration);
        hideCountdown();
        quickActiveBtn = null;
        return;
      }
      // clic sur l'autre bouton = on bascule dessus
      clearInterval(quickInterval);
      quickActiveBtn.classList.remove('is-running');
      quickActiveBtn.innerHTML = quickLabel(quickDuration);
    }

    quickRunning = true;
    quickDuration = duration;
    quickActiveBtn = btn;
    btn.classList.add('is-running');

    let remaining = duration;
    btn.innerHTML = quickLabel(remaining);
    showCountdown(remaining); // affiche tout de suite le décompte, dès le départ

    quickInterval = setInterval(()=>{
      remaining--;
      btn.textContent = remaining > 0 ? quickLabel(remaining) : quickLabel(duration);

      if(remaining > 0){
        showCountdown(remaining);
      } else {
        clearInterval(quickInterval);
        quickRunning = false;
        btn.classList.remove('is-running');
        btn.innerHTML = quickLabel(duration);
        hideCountdown();
        quickActiveBtn = null;
        beep();
      }
    }, 1000);
  }
</script>
